name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: visboard
          POSTGRES_PASSWORD: visboard
          POSTGRES_DB: visboard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U visboard"
          --health-interval 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://visboard:visboard@localhost:5432/visboard
      VISBOARD_TOKEN_PEPPER: ci-pepper-change-me-in-production-min-32-chars

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm typecheck

      - run: pnpm --filter @visboard/db db:migrate

      - run: pnpm test

      - run: pnpm build

      # Smoke test skipped in CI: requires a running API server and linked CLI.
      # Run locally with: docker compose up -d && ./scripts/smoke.sh
