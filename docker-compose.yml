services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: visboard
      POSTGRES_PASSWORD: visboard
      POSTGRES_DB: visboard
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visboard"]
      interval: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://visboard:visboard@postgres:5432/visboard
      VISBOARD_DATA_DIR: /data
      VISBOARD_TOKEN_PEPPER: ${VISBOARD_TOKEN_PEPPER:-change-me-in-production-min-32-chars}
      VISBOARD_AUTO_MIGRATE: "1"
      VISBOARD_CORS_ORIGIN: http://localhost:3000
      VISBOARD_ALLOW_INSECURE_DEFAULTS: "1"
    volumes:
      - uploads:/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/v1
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
